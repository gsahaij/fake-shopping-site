<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fake Shop</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header><h1>Fake Shop</h1><button id="cart-toggle">Cart (<span id="cart-count">0</span>)</button></header>
  <main>
    <section id="products" class="grid" aria-label="Products"></section>
    <aside id="cart" hidden aria-label="Shopping cart">
      <h2>Your cart</h2>
      <ul id="cart-items"></ul>
      <form class="promo" id="promo-form"><input id="promo-input" placeholder="Promo code" aria-label="Promo code"><button>Apply</button></form>
      <p id="promo-msg" aria-live="polite"></p>
      <p>Discount: <span id="cart-discount">$0.00</span></p>
      <p>Total: <strong id="cart-total">$0.00</strong></p>
    </aside>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
